<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>CareerFlow</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="brand"><span>↗</span> CareerFlow</div>

<section id="auth">
  <p class="eyebrow">CONNECT YOUR WORKSPACE</p>
  <h1>Save jobs as you browse.</h1>
  <input id="email" type="email" placeholder="Email address" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button id="login">Connect account</button>
  <p id="message" class="msg"></p>
  <p class="hint">Don't have an account? <a href="https://careerflow-liart.vercel.app/" target="_blank" rel="noopener">Sign up on CareerFlow</a></p>
</section>

<section id="capture" hidden>
  <p class="eyebrow" id="detect-status">CURRENT JOB PAGE</p>

  <label class="field">Role
    <input id="role" type="text" maxlength="120">
  </label>
  <label class="field">Company
    <input id="company" type="text" maxlength="120">
  </label>
  <label class="field">Location
    <input id="location" type="text" maxlength="120">
  </label>

  <div class="row">
    <label class="field half">Work mode
      <select id="work_mode">
        <option>Remote</option>
        <option>Hybrid</option>
        <option>Onsite</option>
        <option selected>Unknown</option>
      </select>
    </label>
    <label class="field half">Type
      <select id="employment_type">
        <option selected>Full-time</option>
        <option>Part-time</option>
        <option>Contract</option>
        <option>Internship</option>
        <option>Freelance</option>
      </select>
    </label>
  </div>

  <div class="row">
    <label class="field half">Status
      <select id="status">
        <option selected>Wishlist</option>
        <option>Applied</option>
        <option>Interviewing</option>
        <option>Offer</option>
        <option>Rejected</option>
      </select>
    </label>
    <label class="field half">Salary
      <input id="salary" type="text" maxlength="80" placeholder="Optional">
    </label>
  </div>

  <label class="field">Job link
    <input id="job_url" type="text" readonly>
  </label>

  <button id="save">Save to CareerFlow</button>

  <label class="toggle">
    <input id="auto" type="checkbox" checked>
    Automatically save when I submit an application on any site
  </label>

  <button id="logout" class="secondary">Disconnect</button>
  <p id="message2" class="msg"></p>
</section>

<script src="popup.js"></script>
</body>
</html>
